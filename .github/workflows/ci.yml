name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: veyra, POSTGRES_PASSWORD: veyra, POSTGRES_DB: veyra }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U veyra" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      VEYRA_ENV: test
      VEYRA_DATABASE_URL: postgresql+asyncpg://veyra:veyra@localhost:5432/veyra
      VEYRA_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - name: OpenAPI schema is committed and current
        run: |
          uv run python -m app.scripts.export_openapi ../../packages/api-client/openapi.json
          git diff --exit-code -- ../../packages/api-client/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is current
        run: pnpm --filter @veyra/api-client check
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @veyra/web build
